<div class="flex min-h-dvh items-center justify-center p-4">
  <mat-card class="w-full max-w-sm">
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <mat-card-header class="flex-col items-center gap-2 pt-8 pb-2">
      <mat-icon class="scale-150 text-primary">backup</mat-icon>
      <mat-card-title>simple-backup</mat-card-title>
      <mat-card-subtitle>Anmeldung erforderlich</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2 pt-4">
        <mat-form-field>
          <mat-label>Benutzername</mat-label>
          <input matInput formControlName="username" autocomplete="username" autofocus />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Passwort</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        <!-- Bewusst ohne Angabe, ob Benutzername oder Passwort falsch war. -->
        @if (failed()) {
          <p class="m-0 flex items-center gap-2 text-sm text-error" role="alert">
            <mat-icon class="text-base">error_outline</mat-icon>
            Anmeldung fehlgeschlagen
          </p>
        }

        <button
          matButton="filled"
          type="submit"
          class="mt-2"
          [disabled]="form.invalid || submitting()"
        >
          Anmelden
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
