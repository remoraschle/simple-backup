spring:
  application:
    name: simple-backup

  datasource:
    url: ${SIMPLEBACKUP_DB_URL:jdbc:postgresql://localhost:5432/simplebackup}
    username: ${SIMPLEBACKUP_DB_USER:simplebackup}
    password: ${SIMPLEBACKUP_DB_PASSWORD:simplebackup}
    hikari:
      pool-name: simple-backup-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    jdbc:
      # Das Session-Schema kommt als Flyway-Migration, nicht ueber diesen Initialisierer.
      initialize-schema: never
    timeout: 12h

  # Anmeldung ueber einen Anbieter (Authelia, Keycloak, Authentik): siehe das Profil
  # "oidc" in application-oidc.yaml. Absichtlich nicht hier mit leeren Platzhaltern -- eine
  # Registrierung ohne client-id laesst die Anwendung beim Start scheitern.

  threads:
    virtual:
      # Ein Backup-Lauf wartet fast ausschliesslich auf einen Kindprozess.
      # Ein virtueller Thread pro Lauf ist damit das einfachste und billigste Modell.
      enabled: true

server:
  port: 8081
  servlet:
    session:
      cookie:
        name: SIMPLEBACKUP_SESSION
        http-only: true
        same-site: lax
        # In Produktion hinter TLS auf true; lokal ueber HTTP sonst kein Cookie.
        secure: ${SIMPLEBACKUP_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: simple-backup

springdoc:
  swagger-ui:
    path: /swagger-ui.html

simplebackup:
  security:
    # Nach so vielen Fehlversuchen wird das Konto zeitweise gesperrt.
    max-failed-logins: 5
    lockout-duration: 15m
  engine:
    # "docker" fuehrt jeden Schritt in einem eigenen Container aus (Betrieb),
    # "local" als Kindprozess des Backends (nur Entwicklung, ohne Isolierung).
    executor: ${SIMPLEBACKUP_EXECUTOR:docker}
    # Blockgeraete, die als Quelle gesichert werden duerfen -- einzeln und vollstaendig.
    # Standardmaessig leer: Ein Geraet durchzureichen macht den rohen Inhalt einer Platte
    # lesbar. Wer das will, sagt es hier ausdruecklich und reicht das Geraet zusaetzlich in
    # der Compose-Datei unter "devices:" durch. Niemals ueber privileged.
    devices: ${SIMPLEBACKUP_DEVICES:}

  docker:
    # Zeigt auf den Socket-Proxy, niemals unmittelbar auf /var/run/docker.sock.
    host: ${DOCKER_HOST:tcp://dockerproxy:2375}
    api-version: v1.51
    connect-timeout: 5s
    request-timeout: 30s
    runner-image: ${SIMPLEBACKUP_RUNNER_IMAGE:ghcr.io/remoraschle/simple-backup-runner:latest}
    # UID:GID im Runner. Konfigurierbar, weil rootless Docker die Kennungen abbildet
    # und eine feste Annahme dort zu Rechtefehlern fuehren wuerde.
    runner-user: ${SIMPLEBACKUP_RUNNER_USER:1000:1000}
    # Nur noetig, wenn in der Compose-Datei ein eigener hostname gesetzt wurde.
    self-container-id: ${SIMPLEBACKUP_SELF_CONTAINER_ID:}
    # Normalerweise leer: Die Einhaengungen kommen aus der eigenen Mount-Tabelle. Gebraucht
    # wird die Angabe dort, wo es keine gibt -- in der lokalen Entwicklung ausserhalb eines
    # Containers waere sonst keine einzige Quelle anlegbar.
    # Format: /host/pfad:/container/pfad[:ro]
    mounts: ${SIMPLEBACKUP_MOUNTS:}

  run:
    log-directory: ${SIMPLEBACKUP_LOG_DIR:/var/lib/simple-backup/logs}
    staging-directory: ${SIMPLEBACKUP_STAGING_DIR:/var/lib/simple-backup/staging}
    # Wann von selbst geprueft wird. Eine Pruefung, die man von Hand anstossen muss, wird
    # genau einmal angestossen -- am Tag der Einrichtung.
    check-cron: "0 0 4 * * SUN"
    log-retention: 90d
    # Ohne diese Grenze koennten nach einem Stillstand alle faelligen Plaene gleichzeitig
    # starten -- gerade dann, wenn der Server ohnehin erst wieder hochgekommen ist.
    max-parallel-runs: ${SIMPLEBACKUP_MAX_PARALLEL_RUNS:2}
    scheduler-poll-interval: 30s
    # Eigenes Zeitlimit fuers Aufraeumen: prune liest das halbe Repository und braucht
    # laenger als eine Sicherung, die nur Aenderungen schreibt.
    prune-timeout: 4h
    # Totmannschalter: Wie oft geprueft wird, ob eine Sicherung ausgeblieben ist, und wie
    # viel Verspaetung vorher geduldet wird.
    watchdog-interval: 15m
    watchdog-grace: 30m
    # Zeitlimit fuers Beschaffen der Daten: Dump, Klon, Abzug.
    acquire-timeout: 4h
    # Der einzige Fall, in dem nicht das Runner-Image verwendet wird: Die Hauptversion muss
    # eingesetzt werden, weil pg_dump sich weigert, eine neuere Datenbank zu lesen als es
    # selbst kennt -- ein Werkzeug mit fester Version sichert irgendwann nichts mehr.
    postgres-image: ${SIMPLEBACKUP_POSTGRES_IMAGE:postgres:%d-alpine}
    # Abweichend nur fuer GitHub Enterprise oder Tests.
    github-api-url: ${SIMPLEBACKUP_GITHUB_API:https://api.github.com}
    # Wie oft die Kennzahlen fuer Prometheus neu erhoben werden. Nicht bei jedem Abruf:
    # Prometheus fragt oefter, als sich hier etwas aendert.
    metrics-interval: 1m

  snapshot:
    # Grosszuegig: Im Ernstfall geht es um viele Daten, und ein Abbruch mitten im
    # Zurueckholen ist das Letzte, was jemand braucht.
    restore-timeout: 12h
    dump-timeout: 10m
    check-timeout: 6h
    # Anteil der Daten, den die Pruefung wirklich liest. Alles zu lesen dauert bei grossen
    # Repositories Stunden; gar nichts zu lesen uebersieht verrottete Daten.
    verify-percent: 5
    staging-directory: ${SIMPLEBACKUP_STAGING_DIR:/var/lib/simple-backup/staging}

  notification:
    # Wie oft der Postausgang geleert wird. Ein Alarm darf nicht erst nach Minuten
    # herausgehen, aber im Leerlauf soll auch nicht im Sekundentakt gefragt werden.
    dispatch-interval: 20s
    batch-size: 20
    # Leer lassen: Dann gilt die echte Adresse von Pushover. Nur Tests biegen sie um.
    pushover-endpoint: ${SIMPLEBACKUP_PUSHOVER_ENDPOINT:}

  oidc:
    # Wie eine Anmeldung beim Anbieter auf einen Benutzer hier abgebildet wird.
    display-name: ${SIMPLEBACKUP_OIDC_NAME:Single Sign-on}
    # Der Anspruch muss stabil sein: Aendert er sich beim Anbieter, entsteht hier ein
    # zweiter Benutzer statt einer Umbenennung.
    username-claim: ${SIMPLEBACKUP_OIDC_USERNAME_CLAIM:preferred_username}
    groups-claim: ${SIMPLEBACKUP_OIDC_GROUPS_CLAIM:groups}
    # Wer hierin ist, wird Administrator, alle anderen duerfen nur lesen. Ohne Angabe
    # bekommt ein neuer Benutzer Leserechte und ein bekannter behaelt seine Rolle -- eine
    # Anmeldung soll niemanden versehentlich zum Administrator machen.
    admin-group: ${SIMPLEBACKUP_OIDC_ADMIN_GROUP:}
    # Wer hierin nicht ist, kommt gar nicht herein. Ohne Angabe darf jeder herein, den der
    # Anbieter durchlaesst.
    required-group: ${SIMPLEBACKUP_OIDC_REQUIRED_GROUP:}

  secrets:
    # Genau eine der beiden Quellen muss gesetzt sein. Die Datei-Variante ist
    # fuer Docker Secrets gedacht und der Umgebungsvariablen vorzuziehen.
    master-key: ${SIMPLEBACKUP_MASTER_KEY:}
    master-key-file: ${SIMPLEBACKUP_MASTER_KEY_FILE:}
    key-version: 1

logging:
  level:
    dev.remo.simplebackup: INFO
