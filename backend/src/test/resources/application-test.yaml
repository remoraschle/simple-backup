spring:
  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    hikari:
      # Jede Testklasse mit eigener Konfiguration bekommt einen eigenen Spring-Kontext und
      # damit einen eigenen Verbindungspool. Mit dem Standard von zehn Verbindungen je Pool
      # sind die Plaetze der Datenbank nach einer Handvoll Kontexte belegt -- und dann
      # scheitern Tests an etwas, das mit ihnen nichts zu tun hat.
      maximum-pool-size: 3
      minimum-idle: 0
      # Ungenutzte Verbindungen zuegig zurueckgeben, damit spaetere Kontexte wieder welche
      # bekommen.
      idle-timeout: 10000

simplebackup:
  run:
    log-directory: ${java.io.tmpdir:/tmp}/simple-backup-test-logs
    staging-directory: ${java.io.tmpdir:/tmp}/simple-backup-test-staging

  engine:
    # Tests, die fuer jeden Fall einen Container hochziehen, laufen zu langsam, um sie oft
    # auszufuehren -- und Tests, die man selten ausfuehrt, findet niemand nuetzlich.
    executor: local

  docker:
    # Zeigt bewusst ins Leere: Kein Test darf einen echten Daemon brauchen.
    host: http://127.0.0.1:1
    connect-timeout: 200ms
    request-timeout: 500ms

  secrets:
    # Fester Testschluessel, damit Tests reproduzierbar sind. Niemals ausserhalb von Tests.
    master-key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
    key-version: 1

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
