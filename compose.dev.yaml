# Entwicklungsumgebung.
#
#   docker compose -f compose.dev.yaml up -d
#   cd backend  && ./mvnw spring-boot:run
#   cd frontend && npm start
#
# Bringt alles mit, was fuer einen vollstaendigen Durchlauf einschliesslich Restore noetig
# ist -- ohne echte Zugangsdaten und ohne echte Backup-Ziele anzufassen.

name: simple-backup-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: simplebackup
      POSTGRES_USER: simplebackup
      POSTGRES_PASSWORD: simplebackup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebackup"]
      interval: 5s
      retries: 10

  # S3-Ziel zum Testen. Konsole unter http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simplebackup
      MINIO_ROOT_PASSWORD: simplebackup
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # SFTP-Ziel und -Quelle zum Testen.
  sftp:
    image: atmoz/sftp:alpine
    command: testuser:testpass:::upload
    ports:
      - "2222:22"
    volumes:
      - sftpdata:/home/testuser/upload

  # Zweite PostgreSQL-Instanz als Sicherungs-Quelle. Bewusst eine aeltere Hauptversion als
  # die Anwendungsdatenbank, damit sich der Versionsabgleich von pg_dump testen laesst.
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beispieldaten
      POSTGRES_USER: beispiel
      POSTGRES_PASSWORD: beispiel
    ports:
      - "5433:5432"

volumes:
  miniodata:
  sftpdata:
