name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf ueberfluessig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Die Integrationstests laufen gegen ein echtes PostgreSQL in einem Container.
      # Gegen eine eingebettete Datenbank zu testen hiesse, das Falsche zu testen: Das
      # Schema nutzt JSONB, Teilindizes und gen_random_uuid().
      - name: Tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Testberichte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatierung pruefen
        run: npx prettier --check "src/**/*.{ts,html,scss,css,json}"

      - name: Tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

  images:
    name: Container-Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Images nur aus dem Hauptzweig veroeffentlichen; Pull Requests werden nur gebaut.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: simple-backup
            dockerfile: docker/backend.Dockerfile
          - name: simple-backup-web
            dockerfile: docker/web.Dockerfile
          - name: simple-backup-runner
            dockerfile: docker/runner.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 mit, damit die Anwendung auch auf einem Raspberry Pi oder einer
          # ARM-basierten NAS laeuft.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  scan:
    name: Schwachstellen-Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # Prueft Abhaengigkeiten und Konfigurationsdateien. Ein Backup-Werkzeug haelt die
      # wertvollsten Zugangsdaten des Betreibers; hier zu sparen waere die falsche Stelle.
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Ergebnis an GitHub melden
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
