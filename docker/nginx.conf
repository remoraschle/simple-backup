server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Die Anwendung laeuft hinter einem eigenen Reverse Proxy, der TLS und den Zugang von
    # aussen uebernimmt. Hier stehen nur die Header, die das Dokument selbst betreffen.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Gehashte Dateinamen duerfen dauerhaft zwischengespeichert werden.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html niemals cachen, sonst laedt der Browser nach einem Update weiterhin die
    # alten, inzwischen geloeschten Chunk-Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live-Logs laufender Backups kommen als Server-Sent Events. Mit Pufferung
        # erschienen sie erst am Ende des Laufs -- also genau dann nicht, wenn man sie
        # braucht.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        # Ein grosser Restore kann lange laufen.
        client_max_body_size 100m;
    }

    location /actuator/health {
        proxy_pass http://backend:8081;
    }

    # Single-Page-Anwendung: Jede unbekannte Adresse beantwortet die Anwendung selbst.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
